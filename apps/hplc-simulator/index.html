<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-Performance Liquid Chromatography Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"></script>
    <link rel="stylesheet" href="./styles.css">
</head>
<body class="bg-gray-100 min-h-screen p-6 font-sans text-gray-800">
    <div class="simulator-layout max-w-[1400px] mx-auto">
        <main class="simulator-main">
            <div class="w-full bg-white p-6 rounded-lg shadow-md" id="controlPanel">
                <nav class="tab-list" role="tablist" aria-label="HPLC simulator controls">
                    <button id="tab-analytes" role="tab" type="button" data-tab="analytes" aria-controls="panel-analytes" aria-selected="true" tabindex="0">Analytes</button>
                    <button id="tab-mobile-phase" role="tab" type="button" data-tab="mobile-phase" aria-controls="panel-mobile-phase" aria-selected="false" tabindex="-1">Mobile phase</button>
                    <button id="tab-solid-phase" role="tab" type="button" data-tab="solid-phase" aria-controls="panel-solid-phase" aria-selected="false" tabindex="-1">Solid phase</button>
                    <button id="tab-settings" role="tab" type="button" data-tab="settings" aria-controls="panel-settings" aria-selected="false" tabindex="-1">Settings (advanced)</button>
                    <button id="tab-simulation" role="tab" type="button" data-tab="simulation" aria-controls="panel-simulation" aria-selected="false" tabindex="-1">Simulation</button>
                </nav>

                <div class="tab-panels">
                    <section id="panel-analytes" class="tab-panel" role="tabpanel" aria-labelledby="tab-analytes" tabindex="0" data-setup-panel>
                        <div class="panel-heading">
                            <div>
                                <h2 data-ui-label="analytes">Analytes</h2>
                                <span id="soluteCatalogStatus" data-ui-label="catalogStatus" class="status-text" aria-live="polite">Local compounds available; PubChem lookup optional</span>
                            </div>
                            <span id="computeStatus" class="status-text" aria-live="polite">Analytical / stochastic CPU</span>
                        </div>
                        <div id="soluteContainer" class="solute-list">
                            <!-- Solute Rows Injected via JS -->
                        </div>
                        <button id="addSoluteBtn" class="secondary-button" type="button">+ Add Solute</button>
                    </section>

                    <section id="panel-mobile-phase" class="tab-panel" role="tabpanel" aria-labelledby="tab-mobile-phase" tabindex="0" data-setup-panel hidden>
                        <div class="parameter-section">
                            <h2>Mobile phase</h2>
                            <div class="control-row">
                                <label for="solventSystem" class="block font-semibold text-sm">Solvent System</label>
                                <select id="solventSystem" class="w-full mt-1 p-2 border rounded bg-gray-50 text-sm">
                                    <option value="1.0">Water / ACN</option>
                                    <option value="0.8">Water / MeOH</option>
                                    <option value="0.9">Water / THF</option>
                                    <option value="0.6">Water / IPA</option>
                                </select>
                            </div>
                            <div class="control-row">
                                <label class="flex justify-between font-semibold text-sm">% Organic <input type="number" id="organicNum" class="w-16 text-right border rounded px-1" value="50" min="0" max="100"></label>
                                <input type="range" id="organic" aria-label="Organic fraction (%)" min="0" max="100" value="50" class="w-full mt-2">
                            </div>
                            <div class="control-row">
                                <label class="flex justify-between font-semibold text-sm">Flow <span class="text-xs font-normal">(mL/min)</span> <output id="flowOutput" class="w-16 text-right border rounded px-1 bg-gray-50">0.00</output></label>
                            </div>
                            <div class="control-row">
                                <label class="flex justify-between font-semibold text-sm">Pressure <span class="text-xs font-normal">(bar)</span> <input type="number" id="pressureNum" class="w-16 text-right border rounded px-1" value="100" min="1" max="400" step="1"></label>
                                <input type="range" id="pressure" aria-label="Pressure (bar)" min="1" max="400" step="1" value="100" class="w-full mt-2">
                            </div>
                        </div>
                    </section>

                    <section id="panel-solid-phase" class="tab-panel" role="tabpanel" aria-labelledby="tab-solid-phase" tabindex="0" data-setup-panel hidden>
                        <div class="parameter-section">
                            <h2>Solid phase</h2>
                            <div class="control-row">
                                <label for="statPhase" class="block font-semibold text-sm">Stationary Phase</label>
                                <select id="statPhase" class="w-full mt-1 p-2 border rounded bg-gray-50 text-sm">
                                    <option value="1.0">C18 (Standard)</option>
                                    <option value="0.7">C8 (Reduced ret.)</option>
                                    <option value="0.4">C4 (Proteins)</option>
                                    <option value="0.8">Phenyl (Pi-Pi)</option>
                                </select>
                            </div>
                            <div class="control-row">
                                <label class="flex justify-between font-semibold text-sm">Length (mm) <input type="number" id="colLengthNum" class="w-16 text-right border rounded px-1" value="150" readonly></label>
                                <input type="range" id="colLength" aria-label="Column length" min="0" max="6" step="1" value="3" class="w-full mt-2">
                                <div class="flex justify-between text-xs text-gray-500 px-1">
                                    <span>30</span><span>50</span><span>100</span><span>150</span><span>200</span><span>250</span><span>300</span>
                                </div>
                            </div>
                        </div>
                    </section>

                    <section id="panel-settings" class="tab-panel" role="tabpanel" aria-labelledby="tab-settings" tabindex="0" data-setup-panel hidden>
                        <div class="parameter-section">
                            <h2>Settings (advanced)</h2>
                            <div class="control-row">
                                <label for="simMode" class="block font-semibold text-sm">Simulation mode</label>
                                <select id="simMode" class="w-full mt-1 p-2 border rounded bg-gray-50 text-sm">
                                    <option value="stochastic" data-ui-label="discrete">Discrete Particles</option>
                                    <option value="continuous" data-ui-label="continuous">Continuous Math</option>
                                </select>
                            </div>
                            <div class="control-row">
                                <label for="simulationSpeedNum" data-ui-label="time" class="block font-semibold text-sm">Simulation speed (×)</label>
                                <div class="flex flex-wrap items-center gap-2 mt-2">
                                    <input type="range" id="simulationSpeed" aria-label="Simulation speed" min="0.01" max="2" step="0.01" value="1" class="w-28">
                                    <input type="number" id="simulationSpeedNum" class="w-16 text-right border rounded px-1" value="1" min="0.01" max="2" step="0.01">
                                    <span class="font-normal text-gray-500">x</span>
                                </div>
                            </div>
                        </div>
                    </section>

                    <section id="panel-simulation" class="tab-panel" role="tabpanel" aria-labelledby="tab-simulation" tabindex="0" hidden>
                        <div class="simulation-actions">
                            <button id="injectBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded flex-1" type="button">Inject &amp; Run</button>
                            <button id="pauseBtn" class="bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-2 px-4 rounded flex-1 hidden" type="button">Pause</button>
                            <button id="flushBtn" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded flex-1 hidden" type="button">Flush Column</button>
                        </div>
                        <div class="simulation-workspace">
                            <div class="column-panel flex flex-col items-center">
                                <div class="column-visual relative bg-transparent">
                                    <div id="pixiContainer" class="w-full absolute top-0 left-0 transition-all duration-300 rounded-b-lg border-2 border-t-0 border-gray-400 overflow-hidden shadow-inner" style="height: 50%; border-bottom: 4px solid #ef4444; background-color: #dbeafe;"></div>
                                </div>
                            </div>
                            <div id="detectorPanel" class="bg-white p-4 rounded-lg shadow-md flex flex-col">
                                <h2 data-ui-label="detector" class="font-bold mb-2 text-blue-700">Detector Signal</h2>
                                <label class="flex items-center gap-2 text-sm font-semibold text-gray-700 mb-2">
                                    <span data-ui-label="xZoom">X zoom</span>
                                    <input type="range" id="detectorZoom" min="1" max="10" step="0.5" value="1" class="w-40">
                                    <output id="detectorZoomOutput" class="w-12 text-right">1x</output>
                                </label>
                                <div id="detectorScroll" class="flex-1 relative w-full h-full">
                                    <div id="detectorCanvasShell" class="relative h-full"><canvas id="chromatogram"></canvas></div>
                                </div>
                            </div>
                        </div>
                    </section>
                </div>
                <p class="physics-status" aria-live="polite">Status: <span id="physicsStatus"></span></p>
            </div>
        </main>
    </div>

    <script type="module" src="./app.js"></script>
</body>
</html>
