<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Virtual Lab Browser Apps</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #f1f5f9;
        color: #1e293b;
      }
      main {
        width: min(960px, calc(100% - 2rem));
        margin: 0 auto;
        padding: 3rem 0;
      }
      .apps {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 1rem;
      }
      a.card {
        display: block;
        padding: 1.25rem;
        border-radius: 0.75rem;
        background: white;
        box-shadow: 0 4px 16px rgb(15 23 42 / 8%);
        color: inherit;
        text-decoration: none;
      }
      a.card:hover {
        outline: 2px solid #2563eb;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Virtual Lab Browser Apps</h1>
      <p>A collection of standalone HTML, JavaScript, and WebGL simulations.</p>
      <section class="apps" aria-label="Browser apps">
        <a class="card" href="./apps/hplc-simulator/">
          <h2>HPLC Simulator</h2>
          <p>Interactive liquid chromatography simulation.</p>
        </a>
      </section>
    </main>
  </body>
</html>
