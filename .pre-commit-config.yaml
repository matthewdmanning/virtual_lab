default_install_hook_types: [pre-commit, pre-push]
exclude: \.(md|wgsl)$
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks
        entry: gitleaks git --pre-commit --staged --redact --verbose
        language: system
        pass_filenames: false
      - id: eslint
        name: eslint
        entry: npm run lint
        language: system
        pass_filenames: false
        types_or: [javascript]
      - id: prettier
        name: prettier
        entry: npm run format:check
        language: system
        pass_filenames: false
        types_or: [javascript, json, yaml, html, css]
      - id: npm-test-and-build
        name: npm test and build (mirrors CI)
        entry: cmd /c "npm test && npm run build"
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
